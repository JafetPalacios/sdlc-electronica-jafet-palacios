name: CI

# Ejecutamos el pipeline en pushes a main y en cualquier pull request
on:
  push:
    branches:
      - main

  pull_request:

  # Permitimos ejecutar CI manualmente para validar controles de automatización
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Provocar un fallo controlado para validar el reporte automático"
        required: false
        default: false
        type: boolean

jobs:
  test:
    # Utilizamos un runner Linux para reproducir un entorno de CI limpio
    runs-on: ubuntu-latest

    steps:
      # Descargamos el contenido del repositorio dentro del runner
      - name: Obtener código
        uses: actions/checkout@v4

      # Configuramos la misma versión de Python utilizada por el proyecto
      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Instalamos las dependencias de desarrollo necesarias para lint, tipado y pruebas
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # Validamos estilo, errores comunes y organización de imports
      - name: Ejecutar Ruff
        run: python -m ruff check app tests migrations

      # Validamos el tipado estático del código
      - name: Ejecutar mypy
        run: python -m mypy app tests migrations --ignore-missing-imports

      # Ejecutamos los tests y exigimos la cobertura mínima definida por el proyecto
      - name: Ejecutar tests
        run: python -m pytest


      # Provocamos un fallo únicamente cuando se solicita desde una ejecución manual
      - name: Simular fallo controlado
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_failure }}
        run: |
          echo "Fallo controlado para validar la creación automática de issues"
          exit 1



  security:
    # Ejecutamos un análisis de vulnerabilidades sobre la imagen de producción
    runs-on: ubuntu-latest

    steps:
      # Descargamos el repositorio para construir la imagen actual
      - name: Obtener código
        uses: actions/checkout@v4

      # Construimos la imagen multi-stage utilizada en producción
      - name: Construir imagen Docker
        run: docker build -t sensorhub:ci .

      # Analizamos vulnerabilidades de severidad alta o crítica
      # Ignoramos hallazgos sin corrección disponible para reducir falsos bloqueos
      - name: Analizar imagen con Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: "sensorhub:ci"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"

  smoke-postgres:
    # Validamos SensorHub contra una instancia PostgreSQL real dentro de GitHub Actions
    runs-on: ubuntu-latest

    services:
      postgres:
        # Utilizamos la misma versión principal de PostgreSQL definida en Docker Compose
        image: postgres:16

        env:
          POSTGRES_USER: sensor
          POSTGRES_PASSWORD: sensorhub_ci
          POSTGRES_DB: sensorhub

        ports:
          - 5432:5432

        # Esperamos a que PostgreSQL acepte conexiones antes de ejecutar los pasos
        options: >-
          --health-cmd "pg_isready -U sensor -d sensorhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Conectamos SensorHub con el PostgreSQL real levantado por GitHub Actions
      DATABASE_URL: postgresql+psycopg://sensor:sensorhub_ci@localhost:5432/sensorhub

    steps:
      # Descargamos el código del repositorio
      - name: Obtener código
        uses: actions/checkout@v4

      # Configuramos Python para ejecutar Alembic y las comprobaciones de SensorHub
      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Instalamos únicamente las dependencias necesarias para ejecutar la aplicación
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # Aplicamos el historial completo de migraciones sobre PostgreSQL
      - name: Aplicar migraciones
        run: python -m alembic upgrade head

      # Verificamos que PostgreSQL tenga la revisión y las tablas esperadas
      - name: Ejecutar smoke test funcional con PostgreSQL
        run: |
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          from fastapi.testclient import TestClient
          from sqlalchemy import inspect, text

          from app.db import engine
          from app.main import app

          # Confirmamos que la conexión real con PostgreSQL funciona
          with engine.connect() as connection:
              assert connection.execute(text("SELECT 1")).scalar_one() == 1

              # Confirmamos que Alembic registró la revisión esperada
              revision = connection.execute(
                  text("SELECT version_num FROM alembic_version")
              ).scalar_one()

          expected_revision = ScriptDirectory.from_config(
              Config("alembic.ini")
          ).get_current_head()

          # Comprobamos que las tablas principales fueron creadas por las migraciones
          tables = set(inspect(engine).get_table_names())

          assert expected_revision is not None
          assert revision == expected_revision
          assert {"alembic_version", "sensors", "readings", "alerts"} <= tables

          # Ejecutar un flujo funcional real contra PostgreSQL
          with TestClient(app) as client:
              # Comprobar que la API arranca y expone el health check liviano
              health_response = client.get("/health")

              assert health_response.status_code == 200

              # Crear un sensor de humedad mediante la API
              sensor_response = client.post(
                  "/sensors/",
                  json={
                      "code": "SMOKE-HUM-001",
                      "name": "Sensor smoke PostgreSQL",
                      "location": "CI PostgreSQL",
                      "sensor_type": "humidity",
                      "unit": "%",
                  },
              )

              # Verificar el contrato actualizado del sensor
              assert sensor_response.status_code == 201

              sensor = sensor_response.json()
              sensor_id = sensor["id"]

              assert sensor["location"] == "CI PostgreSQL"
              assert sensor["is_active"] is True

              # Registrar una lectura válida para el sensor creado
              reading_response = client.post(
                  f"/sensors/{sensor_id}/readings",
                  json={
                      "value": 55.0,
                  },
              )

              assert reading_response.status_code == 201
              reading = reading_response.json()
              reading_id = reading["id"]

              # Consultar nuevamente la lectura para verificar persistencia
              get_reading_response = client.get(
                  f"/readings/{reading_id}",
              )

              assert get_reading_response.status_code == 200
              persisted_reading = get_reading_response.json()

              assert persisted_reading["sensor_id"] == sensor_id
              assert persisted_reading["value"] == 55.0

              # Confirmar que la API expone métricas básicas después del tráfico HTTP
              metrics_response = client.get("/metrics")

              assert metrics_response.status_code == 200
              assert metrics_response.headers["content-type"].startswith("text/plain")
              assert "sensorhub_uptime_seconds " in metrics_response.text

          print("PostgreSQL smoke test funcional correcto")
          print(f"Alembic revision: {revision}")
          print(f"Alembic head esperado: {expected_revision}")
          print(f"Sensor creado: {sensor_id}")
          print(f"Lectura creada y consultada: {reading_id}")
          print(f"Tablas: {sorted(tables)}")
          PY
  deploy-production:
    # Desplegamos a producción únicamente después de validar CI en main
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    needs:
      - test
      - security
      - smoke-postgres

    runs-on: ubuntu-latest
    timeout-minutes: 20

    environment:
      name: production

    env:
      PRODUCTION_HEALTHCHECK_URL: ${{ vars.PRODUCTION_HEALTHCHECK_URL }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}

    steps:
      # Comprobamos que el entorno tenga la configuración necesaria para desplegar
      - name: Validar variables de despliegue
        run: |
          test -n "$RENDER_API_KEY" || { echo "Falta configurar RENDER_API_KEY"; exit 1; }
          test -n "$RENDER_SERVICE_ID" || { echo "Falta configurar RENDER_SERVICE_ID"; exit 1; }

      # Lanzamos un despliegue real sobre el servicio de Render
      - name: Iniciar despliegue en Render
        id: render-deploy
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          api_key = os.environ["RENDER_API_KEY"]
          service_id = os.environ["RENDER_SERVICE_ID"]

          request = urllib.request.Request(
              url=f"https://api.render.com/v1/services/{service_id}/deploys",
              data=b"{}",
              headers={
                  "Accept": "application/json",
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)

          deploy_id = payload["id"]

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"deploy_id={deploy_id}\n")

          print(f"Deploy de Render iniciado: {deploy_id}")
          PY

      # Esperamos a que Render confirme el despliegue del commit actual
      - name: Esperar despliegue en Render
        env:
          RENDER_DEPLOY_ID: ${{ steps.render-deploy.outputs.deploy_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          api_key = os.environ["RENDER_API_KEY"]
          service_id = os.environ["RENDER_SERVICE_ID"]
          deploy_id = os.environ["RENDER_DEPLOY_ID"]

          request_url = (
              f"https://api.render.com/v1/services/{service_id}/deploys/{deploy_id}"
          )
          failure_statuses = {"build_failed", "canceled", "deactivated", "failed", "update_failed"}
          deadline = time.time() + 900
          last_status = None

          while time.time() < deadline:
              request = urllib.request.Request(
                  url=request_url,
                  headers={
                      "Accept": "application/json",
                      "Authorization": f"Bearer {api_key}",
                  },
              )

              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)

              status = payload["status"]

              if status != last_status:
                  print(f"Estado actual del deploy {deploy_id}: {status}")
                  last_status = status

              if status == "live":
                  print(f"Deploy {deploy_id} disponible en producción")
                  break

              if status in failure_statuses:
                  raise SystemExit(f"El deploy {deploy_id} terminó con estado no válido: {status}")

              time.sleep(15)
          else:
              raise SystemExit(f"Tiempo de espera agotado para el deploy {deploy_id}")
          PY

      # Verificamos el health check público después del despliegue
      - name: Validar health check de producción
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          url = os.environ.get("PRODUCTION_HEALTHCHECK_URL") or "https://sensorhub-api-clx6.onrender.com/health"

          with urllib.request.urlopen(url, timeout=30) as response:
              payload = json.load(response)

          assert payload["status"] == "ok"
          print(f"Health check público validado en {url}")
          print(json.dumps(payload, ensure_ascii=True))
          PY
